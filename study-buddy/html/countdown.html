<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown | Study Buddy</title>
  <link rel="stylesheet" href="../css/countdown.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/chatbot.css"/>

</head>
<body>

  <div data-include="../components/header.html"></div>
  
  <main class="timer-container">
    <h2>Countdown Timer</h2>
    <div class="countdown-display" id="countdown">00:00:00</div>

    <div class="input-section">
      <input type="text" id="event-name" placeholder="Event Name" />
      <input type="date" id="event-date" />
      <input type="time" id="event-time" />
    </div>

    <div class="button-group">
      <button class="start" onclick="startCountdown()">Start</button>
      <button class="pause" onclick="pauseCountdown()">Pause</button>
      <button class="reset" onclick="resetCountdown()">Reset</button>
    </div>
  </main>
  <div data-include="../components/chatbot.html"></div>
  <div data-include="../components/footer.html"></div>
  
  <script src="../js/include.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/chatbot.js"></script>
  <script src="../js/countdown.js"></script>

</body>
</html>
